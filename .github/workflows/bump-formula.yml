name: bump-formula

# Triggered from the release workflow of MKuckert/mcp-commands or
# MKuckert/shizo after a successful GoReleaser release. The dispatch
# carries the tag (e.g. "v0.9.0") and the formula name ("mcp-commands" or
# "shizo"; defaults to "mcp-commands") in client_payload.
on:
  repository_dispatch:
    types: [release-bumped]

# The job's own GITHUB_TOKEN commits and pushes; it needs contents: write
# (read is the default and would fail on the push).
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Bump formula
        env:
          TAG: ${{ github.event.client_payload.tag }}
          NAME: ${{ github.event.client_payload.formula || 'mcp-commands' }}
        run: |
          set -euo pipefail

          # The dispatched tag is $GITHUB_REF_NAME (v0.9.0); GoReleaser's
          # {{ .Version }} is bare, so filenames/URLs use the version
          # without the leading v.
          VER="${TAG#v}"
          case "$NAME" in
            mcp-commands|shizo) ;;
            *) echo "unknown formula: ${NAME}" >&2; exit 1 ;;
          esac
          BASE="https://github.com/MKuckert/${NAME}/releases/download/v${VER}"
          F="Formula/${NAME}.rb"

          curl -fsSL -o checksums.txt "${BASE}/checksums.txt"

          # Drop the one-time seed version line + its comment (present only
          # in the v0.8.3 seed; no-ops in steady state, where the URL
          # carries the version). Then rewrite every platform archive url
          # from the tag and the sha256 that follows it from checksums.txt,
          # keeping each line's indentation. A platform without a checksum
          # fails the bump.
          awk -v base="$BASE" -v ver="$VER" -v name="$NAME" '
            NR == FNR { sums[$2] = $1; next }
            /^  # One-time seed/ { next }
            /^  version "[^"]*"[[:space:]]*$/ { next }
            /^[[:space:]]*url .*_(darwin|linux)_(arm64|amd64)\.tar\.gz/ {
              match($0, /(darwin|linux)_(arm64|amd64)/)
              plat = substr($0, RSTART, RLENGTH)
              match($0, /^[[:space:]]*/)
              indent = substr($0, 1, RLENGTH)
              file = name "_" ver "_" plat ".tar.gz"
              sum = sums[file]
              if (sum == "") { print "missing checksum for " file > "/dev/stderr"; exit 1 }
              printf "%surl \"%s/%s\"\n", indent, base, file
              next
            }
            /^[[:space:]]*sha256 "/ { gsub(/"[0-9a-f]+"/, "\"" sum "\""); print; next }
            { print }
          ' checksums.txt "$F" > "$F.new" && mv "$F.new" "$F"

          # Idempotent: re-dispatch on an unchanged version makes no changes;
          # check before the audit so no-op dispatches skip it.
          if git diff --quiet; then
            echo "formula unchanged, nothing to commit"
            exit 0
          fi

          # Gate: the updated formula must audit clean before it ships.
          # brew is not always on the runner PATH.
          if ! command -v brew >/dev/null; then
            for d in /home/linuxbrew/.linuxbrew /opt/homebrew; do
              [ -x "$d/bin/brew" ] && export PATH="$d/bin:$PATH" && break
            done
          fi
          if ! command -v brew >/dev/null; then
            echo "brew not found; bump not committed, run the audit manually" >&2
            exit 1
          fi
          # brew audit takes a formula name, not a path: register the tap
          # in the Homebrew library (current layout is Library/Taps with a
          # lowercased user; `brew tap` would 404 on the legacy mkuckert/tap
          # URL) and audit our working copy by overwriting the clone.
          TAP_ROOT="${HOMEBREW_LIBRARY:-$(brew --prefix)/Homebrew}/Library/Taps/mkuckert"
          TAP_DIR="$TAP_ROOT/homebrew-tap"
          mkdir -p "$TAP_ROOT"
          if [ ! -d "$TAP_DIR" ]; then
            git clone --depth 1 "https://github.com/MKuckert/homebrew-tap" "$TAP_DIR"
          fi
          cp "$F" "$TAP_DIR/Formula/$(basename "$F")"
          # The current Homebrew refuses to load formulas from untrusted taps;
          # this is a CI-registered clone of this very repo, so trust it.
          brew trust --tap mkuckert/tap
          brew audit --formula "$NAME"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "${NAME} ${VER}"
          git push
