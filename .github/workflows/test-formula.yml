name: test-formula

# Self-test on every push/PR. The `test` job runs the formula's own
# `test` block and audits it, natively on Linux (amd64) and macOS
# (arm64). The darwin_amd64 branch cannot run natively on current
# GitHub runners, so the `checksums` job verifies that all three
# release URLs exist and match their checksums instead.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Ensure brew on PATH
        run: |
          set -euo pipefail
          # brew is not always on the runner PATH. $GITHUB_PATH persists to
          # later steps; the export covers this step's own verification.
          if ! command -v brew >/dev/null; then
            for d in /home/linuxbrew/.linuxbrew /opt/homebrew; do
              if [ -x "$d/bin/brew" ]; then
                echo "$d/bin" >> "$GITHUB_PATH"
                export PATH="$d/bin:$PATH"
                break
              fi
            done
          fi
          command -v brew >/dev/null || { echo "brew not found" >&2; exit 1; }
          brew --version

      - name: Register tap
        run: |
          set -euo pipefail
          # brew test/audit take a formula name, not a path: register the tap
          # in brew's taps directory and test our working copy by overwriting
          # the clone. Both the taps directory layout and the tap *name* vary
          # across Homebrew versions (6.x: mkuckert/homebrew-tap, 7.x:
          # mkuckert/tap), so ask brew for both instead of hardcoding.
          TAPS_DIR=$(brew ruby -e 'puts HOMEBREW_TAP_DIRECTORY')
          TAP_DIR="$TAPS_DIR/mkuckert/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          if [ ! -d "$TAP_DIR" ]; then
            git clone --depth 1 "https://github.com/MKuckert/homebrew-tap" "$TAP_DIR"
          fi
          cp Formula/mcp-commands.rb "$TAP_DIR/Formula/"
          TAP_NAME=$(brew tap | grep -E '^mkuckert/' | head -n 1 || true)
          if [ -z "$TAP_NAME" ]; then
            echo "mkuckert tap not found after registration" >&2
            exit 1
          fi
          # The current Homebrew refuses to load formulas from untrusted taps;
          # this is a CI-registered clone of this very repo, so trust it.
          brew trust --tap "$TAP_NAME"

      - name: Run brew test
        run: |
          set -euo pipefail
          # `brew test` requires the formula to be installed, plus its :test
          # dependencies (fish, zsh) and their build deps; --include-test
          # installs all of them.
          brew install --include-test mcp-commands
          brew test --verbose mcp-commands

      - name: Run brew audit
        run: |
          set -euo pipefail
          brew audit --formula mcp-commands

  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Verify release URLs and checksums
        run: |
          set -euo pipefail

          # Extract the (url, sha256) pairs from the formula. Only release
          # archive URLs are matched, so the livecheck URL is ignored.
          awk '
            /url "https:\/\/github\.com\/MKuckert\/mcp-commands\/releases\/download\/v[^"]*_[a-z0-9_]+\.tar\.gz"/ { u = $2 }
            /sha256 "/ { gsub(/"/, "", u); gsub(/"/, "", $2); print u " " $2 }
          ' Formula/mcp-commands.rb > pairs.txt

          # Exactly 3 platform archives today; update if the formula gains
          # another.
          count=$(grep -c . pairs.txt || true)
          if [ "$count" -ne 3 ]; then
            echo "expected 3 url/sha256 pairs in the formula, found $count" >&2
            exit 1
          fi

          # Each supported platform must be present exactly once (guards
          # against a duplicated url sneaking past the count check).
          for suffix in _darwin_amd64 _darwin_arm64 _linux_amd64; do
            matches=$(grep -c "mcp-commands_[0-9.]*${suffix}\.tar\.gz" pairs.txt || true)
            if [ "$matches" -ne 1 ]; then
              echo "expected exactly one archive for ${suffix}, found ${matches}" >&2
              exit 1
            fi
          done

          while IFS=' ' read -r url sum; do
            echo "checking ${url}"
            curl -fsSL "$url" -o archive.tar.gz
            actual=$(sha256sum archive.tar.gz | cut -d' ' -f1)
            rm -f archive.tar.gz
            if [ "$actual" != "$sum" ]; then
              echo "checksum mismatch for ${url}" >&2
              exit 1
            fi
          done < pairs.txt
